name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout TarWak
        uses: actions/checkout@v4
        with:
          repository: 'fifteenhex/tarwak'
          path: 'tarwak'

      - name: Update apt
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y build-essential meson libarchive-dev libcjson-dev libcap-dev erofs-utils linux-libc-dev-m68k-cross clang-tidy

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: _build/*.tar.*
          key: toolchains-${{ runner.os }}-${{ hashFiles('Makefile.ci') }}

      - name: clang-tidy
        continue-on-error: true
        run: make -f Makefile.ci clang-tidy

      - name: build
        run: make -f Makefile.ci build
