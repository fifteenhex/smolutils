name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        config: [default, all-y, all-n, random]
    name: build (${{ matrix.config }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update apt
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y build-essential meson libarchive-dev libcjson-dev libcap-dev erofs-utils linux-libc-dev-m68k-cross libarchive-tools

      # Linting tools, only for default
      - name: Install lint dependencies
        if: matrix.config == 'default'
        run: sudo apt-get install -y clang-tidy

      # QEMU and linux, only for default and all-y as they boot and run tests
      - name: Install boot dependencies
        if: matrix.config == 'default' || matrix.config == 'all-y'
        run: sudo apt-get install -y qemu-system-x86 linux-image-generic

      # Only refresh the toolchains when they change. The makefile might change even if the toolchains don't
      - name: Work out the toolchain key
        id: toolchainkey
        run: |
          key=$(grep -E '^TOOLCHAIN_(URL|M68K|X86_64|DIR)=' Makefile.ci | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache toolchains
        uses: actions/cache@v5
        with:
          path: _build/*.tar.*
          key: toolchains-${{ runner.os }}-${{ steps.toolchainkey.outputs.key }}
          restore-keys: toolchains-${{ runner.os }}-

      - name: clang-tidy
        if: matrix.config == 'default'
        continue-on-error: true
        run: make -f Makefile.ci clang-tidy

      - name: config
        run: make -f Makefile.ci config-${{ matrix.config }}

      - name: build
        run: make -f Makefile.ci build

      # Magic to find a kernel image we can actually read
      # Booting needs a getty and a shell, which all-n and random might not have
      - name: pick a kernel
        if: matrix.config == 'default' || matrix.config == 'all-y'
        run: |
          kernel=
          for k in $(ls -1 /boot/vmlinuz-* | sort -V -r); do
            if [ -r "$k" ]; then kernel=$k; break; fi
          done
          if [ -z "$kernel" ]; then
            newest=$(ls -1 /boot/vmlinuz-* | sort -V | tail -1)
            echo "no readable kernel, taking a copy of $newest"
            mkdir -p _build
            sudo cat "$newest" > _build/vmlinuz
            kernel=_build/vmlinuz
          fi
          echo "using $kernel"
          echo "KERNEL=$kernel" >> "$GITHUB_ENV"

      - name: boot
        if: matrix.config == 'default' || matrix.config == 'all-y'
        run: make -f Makefile.ci boot KERNEL="$KERNEL"

      - name: test
        if: matrix.config == 'default' || matrix.config == 'all-y'
        run: make -f Makefile.ci test KERNEL="$KERNEL"

      - name: set sizes
        if: matrix.config == 'default'
        run: make -f Makefile.ci set-sizes | tee -a "$GITHUB_STEP_SUMMARY"
