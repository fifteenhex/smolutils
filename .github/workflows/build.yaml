name: Build

on: [push]

jobs:
  # Build the image once, the matrix runs in it
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Work out the image name
        id: name
        run: |
          key=$(cat Dockerfile.ci <(grep -E '^TOOLCHAIN_' Makefile.ci) | sha256sum | cut -c1-16)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:ci-$key" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image if needed
        run: |
          image=${{ steps.name.outputs.image }}
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image exists"
          else
            docker build --provenance=false -f Dockerfile.ci -t "$image" .
            docker push "$image"
          fi

  build:
    needs: image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, m68k]
        config: [default, all-y, all-n, random]
        # Only x86_64 boots so far
        include:
          - arch: x86_64
            boots: true
    name: ${{ matrix.arch }} (${{ matrix.config }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use the deps from the image
        run: ln -s /ci/_build _build

      - name: clang-tidy
        if: matrix.arch == 'x86_64' && matrix.config == 'default'
        continue-on-error: true
        run: make -f Makefile.ci clang-tidy

      - name: config
        run: make -f Makefile.ci config-${{ matrix.config }}

      - name: build
        run: make -f Makefile.ci build ARCH=${{ matrix.arch }}

      - name: boot
        if: matrix.boots && (matrix.config == 'default' || matrix.config == 'all-y')
        run: make -f Makefile.ci boot ARCH=${{ matrix.arch }}

      - name: test
        if: matrix.boots && (matrix.config == 'default' || matrix.config == 'all-y')
        run: make -f Makefile.ci test ARCH=${{ matrix.arch }} SUMMARY="$GITHUB_STEP_SUMMARY"

      - name: set sizes
        if: matrix.config == 'default'
        run: make -f Makefile.ci set-sizes ARCH=${{ matrix.arch }} | tee -a "$GITHUB_STEP_SUMMARY"
