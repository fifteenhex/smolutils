name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update apt
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y build-essential meson libarchive-dev libcjson-dev libcap-dev erofs-utils linux-libc-dev-m68k-cross clang-tidy libarchive-tools qemu-system-x86 linux-image-generic

      # Only refresh the toolchains when they change. The makefile might change even if the toolchains don't
      - name: Work out the toolchain key
        id: toolchainkey
        run: |
          key=$(grep -E '^TOOLCHAIN_(URL|M68K|X86_64|DIR)=' Makefile.ci | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache toolchains
        uses: actions/cache@v5
        with:
          path: _build/*.tar.*
          key: toolchains-${{ runner.os }}-${{ steps.toolchainkey.outputs.key }}
          restore-keys: toolchains-${{ runner.os }}-

      - name: clang-tidy
        continue-on-error: true
        run: make -f Makefile.ci clang-tidy

      - name: build
        run: make -f Makefile.ci build

      # Magic to find a kernel image we can actually read
      - name: pick a kernel
        run: |
          kernel=
          for k in $(ls -1 /boot/vmlinuz-* | sort -V -r); do
            if [ -r "$k" ]; then kernel=$k; break; fi
          done
          if [ -z "$kernel" ]; then
            newest=$(ls -1 /boot/vmlinuz-* | sort -V | tail -1)
            echo "no readable kernel, taking a copy of $newest"
            mkdir -p _build
            sudo cat "$newest" > _build/vmlinuz
            kernel=_build/vmlinuz
          fi
          echo "using $kernel"
          echo "KERNEL=$kernel" >> "$GITHUB_ENV"

      - name: boot
        run: make -f Makefile.ci boot KERNEL="$KERNEL"
